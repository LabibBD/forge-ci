name: FORGE-CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install FORGE-CI
        run: python -m pip install -e ".[dev,sim]"

      - name: Run tests and linting
        run: ./scripts/check.sh

      - name: Run end-to-end regression detection
        run: ./scripts/e2e.sh

      - name: Generate LineWorld artifacts
        run: |
          forgeci evaluate \
            configs/smoke.yaml \
            --output-dir runs/ci-line

      - name: Generate MuJoCo artifacts
        run: |
          forgeci evaluate \
            configs/mujoco_reach.yaml \
            --output-dir runs/ci-mujoco

      - name: Generate disturbed MuJoCo artifacts
        run: |
          forgeci evaluate \
            configs/mujoco_disturbed.yaml \
            --output-dir runs/ci-mujoco-disturbed

      - name: Generate robustness-sweep artifacts
        run: |
          forgeci sweep \
            configs/mujoco_robustness_sweep.yaml \
            --output-dir runs/ci-sweep

      - name: Generate failure-analysis artifacts
        run: |
          set +e

          forgeci evaluate \
            configs/mujoco_bias_failure.yaml \
            --output-dir runs/ci-failure

          evaluation_status=$?

          set -e

          if [ "$evaluation_status" -ne 2 ]; then
            echo "Expected evaluation exit code 2."
            echo "Received exit code: $evaluation_status"
            exit 1
          fi

          failure_run=$(
            find runs/ci-failure \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort |
            tail -n 1
          )

          forgeci analyze-failures "$failure_run"

          python - "$failure_run" <<'PYVERIFY'
          import json
          import sys
          from pathlib import Path

          run_dir = Path(sys.argv[1])

          report = json.loads(
              (run_dir / "failure_analysis.json").read_text(
                  encoding="utf-8"
              )
          )

          assert report["failed_episodes"] == 8
          assert report["failure_rate"] == 1.0
          assert report["dominant_failure_type"] == "command_bias"

          clusters = report["clusters"]

          assert len(clusters) == 1
          assert clusters[0]["count"] == 8
          assert clusters[0]["mean_confidence"] == 0.98

          print("Failure-analysis artifact verification passed.")
          PYVERIFY

      - name: Discover and verify failure boundary
        run: |
          forgeci discover-boundary \
            configs/mujoco_bias_boundary.yaml \
            --output-dir runs/ci-boundary

          boundary_run=$(
            find runs/ci-boundary \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort |
            tail -n 1
          )

          test -n "$boundary_run"

          python - "$boundary_run" <<'PYVERIFY'
          import json
          import sys
          from pathlib import Path

          import yaml

          run_dir = Path(sys.argv[1])

          summary = json.loads(
              (run_dir / "boundary_summary.json").read_text(
                  encoding="utf-8"
              )
          )

          counterexample = yaml.safe_load(
              (run_dir / "counterexample.yaml").read_text(
                  encoding="utf-8"
              )
          )

          assert summary["converged"] is True
          assert summary["boundary_width"] <= 0.001

          assert (
              summary["largest_passing_value"]
              < summary["smallest_failing_value"]
          )

          assert (
              summary["dominant_failure_type"]
              == "command_bias"
          )

          trials = summary["trials"]

          assert len(trials) >= 3
          assert trials[0]["label"] == "lower-bound"
          assert trials[0]["gate_passed"] is True
          assert trials[1]["label"] == "upper-bound"
          assert trials[1]["gate_passed"] is False

          discovered_bias = (
              counterexample["policy"]["target_bias"]
          )

          assert discovered_bias < 0.0

          assert abs(
              abs(discovered_bias)
              - summary["smallest_failing_value"]
          ) <= 1e-12

          print(
              "Verified failure boundary:",
              summary["largest_passing_value"],
              "->",
              summary["smallest_failing_value"],
          )
          PYVERIFY

      - name: Discover and verify robustness envelope
        run: |
          forgeci discover-envelope \
            configs/mujoco_bias_envelope.yaml \
            --output-dir runs/ci-envelope

          envelope_run=$(
            find runs/ci-envelope \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort |
            tail -n 1
          )

          test -n "$envelope_run"

          python - "$envelope_run" <<'PYVERIFY'
          import json
          import sys
          from pathlib import Path

          run_dir = Path(sys.argv[1])

          summary = json.loads(
              (run_dir / "envelope_summary.json").read_text(
                  encoding="utf-8"
              )
          )

          dimensions = summary["dimensions"]

          assert summary["all_converged"] is True
          assert len(dimensions) == 2

          names = {
              dimension["name"]
              for dimension in dimensions
          }

          assert names == {
              "positive-command-bias",
              "negative-command-bias",
          }

          assert (
              summary["weakest_dimension"]
              == dimensions[0]["name"]
          )

          normalized_positions = [
              dimension[
                  "normalized_boundary_position"
              ]
              for dimension in dimensions
          ]

          assert normalized_positions == sorted(
              normalized_positions
          )

          for dimension in dimensions:
              assert dimension["converged"] is True
              assert dimension["boundary_width"] <= 0.001

              assert (
                  dimension["dominant_failure_type"]
                  == "command_bias"
              )

              search_dir = (
                  run_dir
                  / dimension["search_directory"]
              )

              assert search_dir.exists()

              assert (
                  search_dir / "counterexample.yaml"
              ).exists()

              assert (
                  search_dir / "boundary_summary.json"
              ).exists()

          assert (
              run_dir / "robustness_envelope.csv"
          ).exists()

          print(
              "Verified weakest dimension:",
              summary["weakest_dimension"],
          )
          PYVERIFY

      - name: Verify multidimensional robustness envelope
        run: |
          forgeci discover-envelope \
            configs/mujoco_multidimensional_envelope.yaml \
            --output-dir runs/ci-multidimensional-envelope

          envelope_run=$(
            find runs/ci-multidimensional-envelope \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort |
            tail -n 1
          )

          test -n "$envelope_run"

          python - "$envelope_run" <<'PYVERIFY'
          import json
          import sys
          from pathlib import Path

          run_dir = Path(sys.argv[1])

          summary_path = (
              run_dir / "envelope_summary.json"
          )

          csv_path = (
              run_dir / "robustness_envelope.csv"
          )

          assert summary_path.exists()
          assert csv_path.exists()

          summary = json.loads(
              summary_path.read_text(
                  encoding="utf-8"
              )
          )

          dimensions = summary["dimensions"]

          expected_names = {
              "positive-command-bias",
              "negative-command-bias",
              "controller-gain-loss",
              "actuator-delay",
              "control-noise",
              "joint-damping",
          }

          assert summary["all_converged"] is True
          assert len(dimensions) == 6

          names = {
              dimension["name"]
              for dimension in dimensions
          }

          assert names == expected_names

          assert (
              summary["weakest_dimension"]
              == dimensions[0]["name"]
          )

          positions = [
              dimension[
                  "normalized_boundary_position"
              ]
              for dimension in dimensions
          ]

          assert positions == sorted(positions)

          for dimension in dimensions:
              assert dimension["converged"] is True

              assert (
                  dimension[
                      "largest_passing_magnitude"
                  ]
                  < dimension[
                      "smallest_failing_magnitude"
                  ]
              )

              assert (
                  0.0
                  < dimension[
                      "normalized_boundary_position"
                  ]
                  <= 1.0
              )

              assert (
                  dimension[
                      "dominant_failure_type"
                  ]
                  is not None
              )

              search_dir = (
                  run_dir
                  / dimension["search_directory"]
              )

              boundary_path = (
                  search_dir
                  / "boundary_summary.json"
              )

              counterexample_path = (
                  search_dir
                  / "counterexample.yaml"
              )

              assert boundary_path.exists()
              assert counterexample_path.exists()

              boundary = json.loads(
                  boundary_path.read_text(
                      encoding="utf-8"
                  )
              )

              failure_run = (
                  search_dir
                  / boundary[
                      "counterexample_run_directory"
                  ]
              )

              assert (
                  failure_run
                  / "failure_analysis.json"
              ).exists()

              assert (
                  failure_run
                  / "failure_clusters.csv"
              ).exists()

          print(
              "Verified six-dimensional envelope."
          )

          print(
              "Weakest dimension:",
              summary["weakest_dimension"],
          )
          PYVERIFY

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forge-ci-evaluation-artifacts
          path: |
            runs/ci-line/
            runs/ci-mujoco/
            runs/ci-mujoco-disturbed/
            runs/ci-sweep/
            runs/ci-failure/
            runs/ci-boundary/
            runs/ci-envelope/
            runs/ci-multidimensional-envelope/
          if-no-files-found: ignore
          retention-days: 14
